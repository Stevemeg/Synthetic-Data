limit_req_zone $binary_remote_addr zone=api_submissions:10m rate=2r/s;
server {
  listen 8080;
  server_tokens off;
  # Standard combined logs include authorization callback query strings.
  access_log off;
  root /usr/share/nginx/html;
  client_max_body_size 10m;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header X-Frame-Options DENY always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  # Emotion currently requires inline style attributes; scripts remain same-origin.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
  location /internal/ { return 404; }
  location /api/ {
    limit_req zone=api_submissions burst=30 nodelay;
    proxy_pass http://api:5000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location = /ready { proxy_pass http://api:5000; }
  location = /health { proxy_pass http://api:5000; }
  location /assets/ { expires 1y; }
  location / { expires -1; try_files $uri $uri/ /index.html; }
}
