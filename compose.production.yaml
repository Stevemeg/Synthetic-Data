# Provider-neutral private deployment. Supply secrets externally; TLS terminates outside.
x-production: &production
  APP_ENV: production
  AUTH_MODE: oidc
  DATABASE_URL: ${DATABASE_URL:?Supply private PostgreSQL credentials}
  OIDC_ISSUER: ${OIDC_ISSUER:?Supply HTTPS discovery issuer}
  OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:?Supply registered OIDC client ID}
  OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
  OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:?Supply externally visible HTTPS callback}
  OIDC_INTERNAL_ORIGIN: ${OIDC_INTERNAL_ORIGIN:-}
  FRONTEND_URL: ${FRONTEND_URL:?Supply externally visible HTTPS origin}
  CORS_ORIGINS: ${CORS_ORIGINS:?Supply explicit HTTPS origins}
  SESSION_SECRET: ${SESSION_SECRET:?Inject a generated session signing secret}
  METRICS_TOKEN: ${METRICS_TOKEN:?Inject a generated private metrics token}
  ARTIFACT_STORAGE_BACKEND: s3
  S3_BUCKET: ${S3_BUCKET:?Supply private bucket}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_ENDPOINT: ${S3_ENDPOINT:-}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
  S3_SECRET_KEY: ${S3_SECRET_KEY:-}
  S3_SERVER_SIDE_ENCRYPTION: ${S3_SERVER_SIDE_ENCRYPTION:-}
  UPLOAD_DIR: /tmp/uploads
services:
  api:
    image: medsynth-api:${APP_RELEASE:?Set the VERSION-matched image tag}
    environment: *production
    read_only: true
    tmpfs: ["/tmp:uid=10001,gid=10001,mode=1770"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
  worker:
    image: medsynth-worker:${APP_RELEASE:?Set the VERSION-matched image tag}
    environment:
      <<: *production
      WORKER_METRICS_PORT: "9091"
    read_only: true
    tmpfs: ["/tmp:uid=10001,gid=10001,mode=1770", "/app/backend/.work:uid=10001,gid=10001,mode=1770"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped
  frontend:
    image: medsynth-frontend:${APP_RELEASE:?Set the VERSION-matched image tag}
    ports: ["127.0.0.1:8088:8080"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped
  migration:
    image: medsynth-api:${APP_RELEASE:?Set the VERSION-matched image tag}
    profiles: [maintenance]
    environment: *production
    command: ["python", "-m", "alembic", "upgrade", "head"]
