[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]
addopts = "-ra -m 'not model and not integration'"
markers = ["model: optional tiny CPU model integration tests; no large training", "integration: requires real PostgreSQL; isolated disposable schemas"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
